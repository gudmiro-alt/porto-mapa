<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Porto 2026 — mapa główna</title><style>
:root{
 --bg:#f5f6f8;--card:#fff;--ink:#111827;--muted:#667085;--line:#e4e7ec;--soft:#f8fafc;
 --btnPrimaryBg:#111827;--btnPrimaryText:#fff;
 --btnAltBg:#eef2f6;--btnAltText:#344054;--btnAltBorder:#d0d5dd;
 --tabBg:#fff;--tabBorder:#d0d5dd;--tabActiveBg:#111827;--tabActiveText:#fff;
 --shadow:rgba(16,24,40,.08);
 --hotelBg:#dcfce7;--hotelText:#166534;
 --restBg:#f3e8ff;--restText:#6b21a8;
 --finishBg:#ecfdf3;--finishBorder:#bbf7d0;--finishText:#166534;
 --doneOpacity:.5;
 --mapBorder:#e2e8f0;
}
@media (prefers-color-scheme:dark){
 :root{
  --bg:#0b0f17;--card:#141a26;--ink:#eef1f6;--muted:#98a3b7;--line:#26314a;--soft:#101725;
  --btnPrimaryBg:#e8ecf3;--btnPrimaryText:#0b0f17;
  --btnAltBg:#1b2333;--btnAltText:#c7cedd;--btnAltBorder:#2c3750;
  --tabBg:#141a26;--tabBorder:#2c3750;--tabActiveBg:#e8ecf3;--tabActiveText:#0b0f17;
  --shadow:rgba(0,0,0,.5);
  --hotelBg:#0f2e1c;--hotelText:#4ade80;
  --restBg:#2a1740;--restText:#c084fc;
  --finishBg:#0d2318;--finishBorder:#16532f;--finishText:#4ade80;
  --doneOpacity:.42;
  --mapBorder:#26314a;
 }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px}
h1{font-size:18px;margin:0}
.sub{font-size:12px;color:var(--muted);margin-top:3px}
.viewTabs{display:flex;gap:6px;margin-top:11px}
.viewTab{flex:1;text-align:center;border:1px solid var(--tabBorder);background:var(--tabBg);color:var(--ink);border-radius:11px;padding:8px 6px;font-size:12px;font-weight:800;cursor:pointer}
.viewTab.active{background:var(--tabActiveBg);color:var(--tabActiveText);border-color:var(--tabActiveBg)}
.tabs{display:flex;gap:7px;overflow:auto;margin-top:9px;padding-bottom:2px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--tabBorder);background:var(--tabBg);color:var(--ink);border-radius:999px;padding:8px 11px;font-size:12px;font-weight:800;white-space:nowrap;cursor:pointer}
.tab.active{background:var(--tabActiveBg);color:var(--tabActiveText);border-color:var(--tabActiveBg)}
main{max-width:820px;margin:auto;padding:10px;padding-bottom:92px}
.card{background:var(--card);border-radius:18px;padding:14px;margin:10px 0;box-shadow:0 2px 12px var(--shadow)}
.dayh{font-size:19px;font-weight:900}
.summary{font-size:13px;line-height:1.5;margin-top:6px;color:var(--ink)}
.routeLine{margin-top:10px;font-size:12px;line-height:1.55;color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px}
.btnrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.btn{display:inline-block;text-decoration:none;border:0;border-radius:10px;padding:9px 11px;font-size:12px;font-weight:800;cursor:pointer;font-family:inherit}
.btn.primary{background:var(--btnPrimaryBg);color:var(--btnPrimaryText)}
.btn.alt{background:var(--btnAltBg);color:var(--btnAltText);border:1px solid var(--btnAltBorder)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:700}
.btn:disabled{opacity:.4;cursor:default}
.note{font-size:12px;line-height:1.5;color:var(--muted);margin-top:8px}
.step{padding:13px 0;border-bottom:1px solid var(--line);display:flex;gap:10px}
.step:last-child{border-bottom:0}
.step.done{opacity:var(--doneOpacity)}
.stepCheck{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--card);cursor:pointer;margin-top:2px;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.step.done .stepCheck{background:var(--btnPrimaryBg);border-color:var(--btnPrimaryBg);color:var(--btnPrimaryText)}
.stepBody{flex:1;min-width:0}
.time{font-size:11px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.02em}
.stepTitle{font-size:15px;font-weight:900;margin-top:2px}
.stepNote{font-size:13px;line-height:1.5;margin-top:4px;color:var(--ink)}
.distance{display:block;font-size:11.5px;font-weight:800;color:#2563eb;margin-top:5px}
.transportBox{margin-top:8px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:9px 10px}
.transportTitle{font-size:12px;font-weight:900}
.transportText{font-size:12px;color:var(--muted);line-height:1.45;margin-top:2px}
.hotelTag{display:inline-block;background:var(--hotelBg);color:var(--hotelText);border-radius:999px;padding:3px 7px;font-size:10px;font-weight:900;margin-left:6px}
.restTag{display:inline-block;background:var(--restBg);color:var(--restText);border-radius:999px;padding:3px 7px;font-size:10px;font-weight:900;margin-left:6px}
.finish{margin-top:10px;padding:11px 12px;border-radius:12px;background:var(--finishBg);border:1px solid var(--finishBorder);font-size:12px;line-height:1.45;color:var(--finishText)}
.restaurantNote{font-size:12px;line-height:1.5;color:var(--muted);margin-top:6px;padding-left:2px}
.restaurantNote b{color:var(--ink)}
.restaurantNote .addr{display:block;margin-top:3px}
.dayMeta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
.pill{font-size:11px;font-weight:800;color:var(--muted);background:var(--soft);border:1px solid var(--line);padding:5px 8px;border-radius:999px}
.dayStats{margin-top:10px;padding:11px 12px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.dayStatsTotal{font-size:13px;font-weight:700;color:var(--ink)}
.dayStatsGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.statChip{display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
.statIcon{font-size:14px;flex:0 0 auto}
.statLabel{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;flex:1}
.statVal{font-size:12px;font-weight:800;color:var(--ink);white-space:nowrap}
.dayStatsNote{font-size:11px;color:var(--muted);line-height:1.45;margin-top:8px}
.realTime{color:var(--muted);font-weight:700;text-transform:none}
.progressRow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:11.5px;color:var(--muted);font-weight:700}
.progressRow button{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:11.5px;cursor:pointer;font-family:inherit;padding:0}
.planB{margin-top:8px;padding:9px 10px;border-radius:12px;background:#fff7ed;border:1px solid #fdba74;font-size:12.5px;line-height:1.5;color:#9a3412}
@media (prefers-color-scheme:dark){.planB{background:#2a1a0a;border-color:#7c3f11;color:#fdba74}}
.more{margin-top:8px}
.moreToggle{font-size:12px;font-weight:800;color:var(--muted);cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.moreBody{display:none;margin-top:7px;font-size:13px;line-height:1.55;color:var(--ink)}
.moreBody.open{display:block}
.photoTip{margin-top:7px;font-size:12px;line-height:1.5;color:var(--muted);display:flex;gap:6px}
.photoTip .cam{flex:0 0 auto}
.icon{margin-right:5px}
.mapBtn{margin-top:10px}
.mapWrap{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--mapBorder);display:none}
.mapWrap.open{display:block}
.mapEl{width:100%;height:260px}
.mapMeta{padding:8px 10px;font-size:11.5px;color:var(--muted);background:var(--soft);border-top:1px solid var(--mapBorder)}
.searchBox{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);font-size:14px;font-family:inherit;margin-top:4px}
.searchBox::placeholder{color:var(--muted)}
.idxItem{padding:11px 0;border-bottom:1px solid var(--line)}
.idxItem:last-child{border-bottom:0}
.idxItem.visited{opacity:var(--doneOpacity)}
.idxHead{display:flex;align-items:center;gap:8px;cursor:pointer}
.idxNum{font-size:11px;font-weight:900;color:var(--muted);flex:0 0 auto;min-width:22px;text-align:center}
.idxDoneMark{color:var(--finishText);margin-left:2px}
.idxDist{padding-left:30px;margin-top:2px!important}
.idxName{font-size:14.5px;font-weight:800;flex:1}
.idxKind{font-size:10.5px;color:var(--muted);font-weight:700}
.idxBody{display:none;margin-top:8px;padding-left:28px}
.idxBody.open{display:block}
.sectionH{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin:18px 0 6px}
.infoP{font-size:13.5px;line-height:1.6;margin:0 0 10px}
.infoList{margin:0 0 10px;padding-left:18px}
.infoList li{font-size:13.5px;line-height:1.6;margin-bottom:6px}
.linkRow{font-size:13px;padding:9px 0;border-bottom:1px solid var(--line)}
.linkRow:last-child{border-bottom:0}
.linkRow a{color:var(--ink);font-weight:700}
.nowBar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px var(--shadow);display:flex;align-items:center;gap:10px}
.nowBar .nbLabel{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.03em;color:var(--muted)}
.nowBar .nbTitle{font-size:13.5px;font-weight:900;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nowBar .nbInfo{flex:1;min-width:0}
.nowBar .nbDist{font-size:11px;color:var(--muted);margin-top:1px}
.nowBar .nbNext{font-size:11px;color:var(--muted);margin-top:3px;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:640px){main{padding:8px;padding-bottom:92px}.card{padding:12px}}

</style></head><body>

const DATA = {"P":{"1":{"id":"1","name":"Avenida dos Aliados","lat":41.14755,"lon":-8.61125,"kind":"plac","desc":"Reprezentacyjna oś śródmieścia Porto, z monumentalnymi kamienicami i główną przestrzenią miejską Baixy. Dobrze otwiera pobyt, bo od razu pokazuje skalę i charakter centralnego Porto; warto spojrzeć także w kierunku Praça da Liberdade.","number":1,"restaurant":false,"photoTip":"Najlepszy kadr: szeroka perspektywa alei z ratuszem i zabudową po obu stronach.","placeId":"ChIJj_1AWeNkJA0RENJtVObMjXM"},"2":{"id":"2","name":"São Bento","lat":41.14542,"lon":-8.61078,"kind":"atrakcja","desc":"Zabytkowy dworzec słynie z ogromnego holu wyłożonego azulejos przedstawiającymi sceny z historii Portugalii. Nawet krótka wizyta daje jeden z najbardziej charakterystycznych obrazów Porto.","number":2,"restaurant":false,"photoTip":"Wewnątrz warto zwrócić uwagę na kompozycję niebiesko-białych paneli i ich historyczne sceny.","placeId":"ChIJR_lvdeRkJA0RPneoSR6STxI"},"3":{"id":"3","name":"Sé do Porto","lat":41.142795,"lon":-8.611323,"kind":"atrakcja","desc":"Średniowieczna katedra stoi wysoko nad historycznym centrum i jest ważnym punktem orientacyjnym. Plac przed Sé daje szerokie widoki na dachy starego Porto, Douro i Gaia, a sama okolica dobrze pokazuje warstwowość miasta.","number":3,"restaurant":false,"photoTip":"Najciekawsze jest zestawienie wysokiego placu z gęstą zabudową schodzącą w stronę rzeki.","placeId":"ChIJueuROeFkJA0R6Td1oK7MHEo"},"4":{"id":"4","name":"Ponte Dom Luís I","lat":41.14015,"lon":-8.60835,"kind":"most","desc":"Ikoniczny stalowy most łączy Porto z Vila Nova de Gaia i otwiera jedne z najbardziej rozpoznawalnych panoram Douro. Górny poziom jest naturalnym przejściem z historycznego centrum do Gaia i sam w sobie stanowi atrakcję.","number":4,"restaurant":false,"photoTip":"Warto fotografować jednocześnie Ribeirę, Douro, most i zbocza Gaia.","placeId":"ChIJ00b9XOdkJA0Rq2pFmc9AW8I"},"5":{"id":"5","name":"Jardim do Morro","lat":41.13713,"lon":-8.60941,"kind":"widok","desc":"Park po stronie Gaia leży tuż za mostem i jest jednym z najwygodniejszych miejsc do spokojnego oglądania panoramy Porto. Przy dobrej widoczności można stąd objąć wzrokiem Ribeirę, most i dolinę Douro.","number":5,"restaurant":false,"photoTip":"Najlepsze ujęcia powstają, gdy światło miękko oświetla fasady Ribeiry.","placeId":"ChIJqezitd1kJA0RmyhPjA6_g5c"},"6":{"id":"6","name":"Mosteiro da Serra do Pilar","lat":41.138251,"lon":-8.607787,"kind":"zabytek","desc":"Klasztorny kompleks na wzgórzu ponad Gaia daje inną perspektywę niż Jardim do Morro. To miejsce szczególnie cenne fotograficznie, bo szeroko pokazuje Porto, Douro, Ponte Dom Luís I i zbocza Gaia.","number":6,"restaurant":false,"photoTip":"Warto zatrzymać się na panoramę całego korytarza Douro zamiast szybko wracać na nabrzeże.","placeId":"ChIJ5240w91kJA0Ro9AQEdIhcqs"},"7":{"id":"7","name":"Cais de Gaia","lat":41.13762,"lon":-8.61725,"kind":"nabrzeże","desc":"Nabrzeże Vila Nova de Gaia biegnie pod historycznymi piwnicami wina Porto. Widok na Ribeirę z drugiego brzegu jest zupełnie inny niż z Porto, dlatego najlepiej potraktować ten odcinek jako długi spacer i serię obserwacji, a nie pojedynczy punkt.","number":7,"restaurant":false,"photoTip":"Warto patrzeć zarówno na Porto, jak i na rytm starych magazynów oraz łodzi na rzece.","placeId":"ChIJM2hQsxhlJA0Rg8m1ZRiRPiU"},"8":{"id":"8","name":"Praia de Matosinhos","lat":41.1765,"lon":-8.692,"kind":"ocean","desc":"Szeroka plaża otwarta na Atlantyk daje dużo przestrzeni i pozwala wyraźnie obserwować zmiany poziomu wody. To jeden z najlepszych miejsc na spokojny, długi spacer bez potrzeby zagęszczania programu.","number":8,"restaurant":false,"photoTip":"Przy odpływie zwróćcie uwagę na to, jak zmienia się pas mokrego piasku i skał.","placeId":"ChIJ2d-8zjxvJA0RP2Ac4rtI_FM"},"9":{"id":"9","name":"Castelo do Queijo","lat":41.168582,"lon":-8.689925,"kind":"zabytek","desc":"Niewielka forteca São Francisco Xavier stoi na skalistym brzegu między Matosinhos a Foz. Jej położenie jest ważniejsze niż sama skala budowli: ocean, skały i otwarta przestrzeń tworzą bardzo mocny nadmorski kadr.","number":9,"restaurant":false,"photoTip":"Przy większej fali ciekawie wygląda kontrast kamiennej fortecy z Atlantykiem.","placeId":"ChIJV3400xZvJA0RplI-ijkpJgs"},"10":{"id":"10","name":"Pérgola da Foz","lat":41.15145,"lon":-8.6783,"kind":"ocean","desc":"Charakterystyczna kolumnada nad Atlantykiem należy do najbardziej rozpoznawalnych elementów Foz. Dobrze działa jako krótki przystanek podczas dłuższego spaceru, szczególnie gdy można objąć w jednym kadrze ocean, linię brzegu i architekturę.","number":10,"restaurant":false,"photoTip":"Najlepsza jest perspektywa wzdłuż kolumnady, z oceanem w tle.","placeId":"ChIJw0RTFwBlJA0RVCDkL9z9z68"},"11":{"id":"11","name":"Farolim de Felgueiras","lat":41.147427,"lon":-8.675251,"kind":"ocean","desc":"Latarnia stoi na końcu kamiennego mola przy ujściu Douro do Atlantyku. To jeden z najmocniejszych fotograficznie punktów Porto, zwłaszcza przy wysokiej wodzie i większej fali.","number":11,"restaurant":false,"photoTip":"Zachowajcie bezpieczny dystans od mokrych i śliskich fragmentów mola.","placeId":"ChIJPe3wd5lvJA0Rbvo1l-s8RSQ"},"12":{"id":"12","name":"Capela das Almas","lat":41.14984,"lon":-8.605607,"kind":"atrakcja","desc":"Niewielka kaplica przy Rua de Santa Catarina wyróżnia się niebiesko-białą okładziną azulejos. Jest idealna jako krótki przystanek fotograficzny na początku dnia, szczególnie przy spokojnym świetle.","number":12,"restaurant":false,"photoTip":"Najlepiej objąć całą fasadę z pewnego dystansu, bo dekoracja azulejos jest bardzo gęsta.","placeId":"ChIJX55xrvpkJA0RtYd3oxxfEhE"},"13":{"id":"13","name":"Mercado do Bolhão","lat":41.149119,"lon":-8.607216,"kind":"atrakcja","desc":"Odnowiona hala targowa jest ważnym punktem centralnego Porto i dobrym miejscem do obserwacji codziennego życia miasta. Można tu również zrobić rozsądne zakupy produktów na hotelową kolację, bez potrzeby wielkich zapasów.","number":13,"restaurant":false,"photoTip":"Zwróć uwagę na relację starego charakteru targu z odnowioną architekturą hali.","placeId":"ChIJFQzXJeVkJA0R6XxuGdsidvE"},"14":{"id":"14","name":"Igreja do Carmo","lat":41.14747,"lon":-8.61626,"kind":"atrakcja","desc":"Kościół słynie z efektownej fasady pokrytej azulejos, która tworzy jeden z najbardziej fotogenicznych kadrów Baixy. Warto podejść pod sam budynek i zobaczyć, jak dekoracja pracuje z jego barokową bryłą.","number":14,"restaurant":false,"photoTip":"Najlepiej fotografować fasadę prostopadle, aby uchwycić pełny wzór płytek.","placeId":"ChIJyW8tmeJkJA0RdGKANtSBTgE"},"15":{"id":"15","name":"Igreja dos Clérigos","lat":41.14569,"lon":-8.614615,"kind":"atrakcja","desc":"Barokowy zespół związany z Nicolau Nasonim jest jednym z symboli Porto. Nawet bez wchodzenia do środka warto obejrzeć wieżę, kościół i sposób, w jaki dominują nad zabudową okolicy.","number":15,"restaurant":false,"photoTip":"Wieża najlepiej pokazuje pionowy charakter Porto i zmienność poziomów ulic.","placeId":"ChIJSdbOUeJkJA0R8Fnew2FjwXA"},"16":{"id":"16","name":"Miradouro da Vitória","lat":41.14312,"lon":-8.61577,"kind":"widok","desc":"Punkt widokowy na zachodniej stronie starego miasta daje szeroki obraz Sé, Ribeiry, Douro i Gaia. To dobre miejsce na dłuższą pauzę fotograficzną, zamiast tylko szybkiego „odhaczenia” widoku.","number":16,"restaurant":false,"photoTip":"Warto wykorzystać miękkie światło i szukać warstwowości miasta na zboczu.","placeId":"ChIJr8xn--FkJA0RpQ2y3S53gwA"},"17":{"id":"17","name":"Ribeira","lat":41.1404,"lon":-8.6131,"kind":"nabrzeże","desc":"Historyczne nabrzeże Porto jest najbardziej pocztówkowym fragmentem miasta: kolorowe fasady, Douro, łodzie i mosty tworzą zwarty obraz Porto. Warto zostać dłużej i potraktować Ribeirę jako przestrzeń do obserwacji, a nie wyłącznie punkt do zdjęcia.","number":17,"restaurant":false,"photoTip":"Dobry kadr łączy fasady, wodę i most; przy spokojnym świetle warto zrobić zdjęcia z dalszej perspektywy.","placeId":"ChIJicetJOdkJA0R8GJ9Dy_dcgo"},"18":{"id":"18","name":"Miragaia — Rua de Miragaia","lat":41.14282,"lon":-8.62032,"kind":"dzielnica","desc":"Nadrzeczna dzielnica zachowała spokojniejszy charakter niż główna Ribeira. Wąskie ulice, fasady i bliskość Douro tworzą kameralny odcinek spaceru idealny na wolniejsze tempo.","number":18,"restaurant":false,"photoTip":"Warto patrzeć na relację między zabudową a rzeką, szczególnie przy bocznych uliczkach.","placeId":"ChIJz2Xbrh5lJA0RV56RiARjjdE"},"19":{"id":"19","name":"Jardins do Palácio de Cristal","lat":41.1487,"lon":-8.62655,"kind":"park","desc":"Tarasowe ogrody na wzgórzu nad Douro łączą zielone alejki, punkty widokowe i spokojne przestrzenie do siedzenia. Najlepiej przejść większą pętlę przez park, a nie ograniczać się do głównej osi.","number":19,"restaurant":false,"photoTip":"Szukajcie miejsc, gdzie drzewa otwierają szeroki widok na Douro i Gaia.","placeId":"ChIJo2WgoxplJA0ROB2wNY66bGQ"},"20":{"id":"20","name":"Jardim de São Lázaro","lat":41.14593,"lon":-8.60257,"kind":"park","desc":"Klasyczny miejski ogród na wschodnim skraju Baixy daje chwilę oddechu między gęstą zabudową a dzielnicami położonymi dalej na wschód. Jest bardziej lokalny niż główne place turystycznego centrum.","number":20,"restaurant":false,"photoTip":"Dobry punkt na spokojne zatrzymanie i obserwowanie codziennego ruchu miasta.","placeId":"ChIJ47mRIe9kJA0RLD_dNqz52LA"},"21":{"id":"21","name":"Igreja do Bonfim","lat":41.1501,"lon":-8.5952,"kind":"atrakcja","desc":"Monumentalny XIX-wieczny kościół stoi w dzielnicy Bonfim, która ma bardziej lokalny rytm niż główne centrum. Warto tu zwrócić uwagę nie tylko na sam kościół, ale i na starszą zabudowę okolicy.","number":21,"restaurant":false,"photoTip":"To dobry kontrast wobec reprezentacyjnego centrum Porto.","placeId":"ChIJg-QfJY1kJA0RXLLl_o6Q0wk"},"22":{"id":"22","name":"Fontaínhas","lat":41.14292,"lon":-8.60163,"kind":"widok","desc":"Punkt widokowy na wschodnim skraju centrum pokazuje Douro i mosty z innej perspektywy niż Ribeira. Największą wartością jest połączenie panoramy ze spacerem wzdłuż zbocza.","number":22,"restaurant":false,"photoTip":"Szczególnie ciekawie widać tu warstwy zabudowy schodzące do rzeki.","placeId":"ChIJlbh_CelkJA0RniJLSUzuww4"},"23":{"id":"23","name":"Ponte do Infante","lat":41.1409,"lon":-8.60157,"kind":"most","desc":"Most daje kolejną perspektywę na dolinę Douro i układ Porto po wschodniej stronie centrum. Nie trzeba traktować go jako osobnej atrakcji na długo; ważniejszy jest widok podczas przejścia.","number":23,"restaurant":false,"photoTip":"Warto spojrzeć w kierunku Ribeiry i na sąsiednie konstrukcje mostowe.","placeId":"ChIJEdKZvaJlJA0R5kQUyTPU9Mg"},"24":{"id":"24","name":"Casa da Música","lat":41.1584,"lon":-8.630999,"kind":"architektura","desc":"Ikoniczny budynek współczesnej architektury autorstwa Rema Koolhaasa jest jednym z najważniejszych przykładów nowoczesnego Porto. Nawet bez wejścia do środka warto obejść bryłę i zobaczyć, jak zmienia się z różnych stron.","number":24,"restaurant":false,"photoTip":"Najciekawsza jest gra ostrych krawędzi, faset i skali placu wokół budynku.","placeId":"ChIJz0Pm3ABlJA0R7UBFROy6XsM"},"25":{"id":"25","name":"Fundação de Serralves","lat":41.1593,"lon":-8.6598,"kind":"park","desc":"Kompleks łączy park, modernistyczną Casa de Serralves i sztukę współczesną. Park ma własny charakter i pozwala spokojnie przejść od architektury do dużej przestrzeni zielonej, dlatego to dobry punkt programu także bez nacisku na wnętrza.","number":25,"restaurant":false,"photoTip":"Warto zwrócić uwagę na relację geometrycznej architektury Sizy z bardziej miękką zielenią parku.","placeId":"ChIJcSCxVoBlJA0RFNAb4ighgKM"},"26":{"id":"26","name":"Parque da Cidade do Porto","lat":41.16938,"lon":-8.67976,"kind":"park","desc":"Rozległy park prowadzi aż do oceanu i daje poczucie znacznie większej przestrzeni niż centralne Porto. To idealny odcinek na spokojny, długi marsz po lunchu.","number":26,"restaurant":false,"photoTip":"Warto obserwować, jak park stopniowo otwiera się w stronę Atlantyku.","placeId":"ChIJA0-Wd2xvJA0RDJEgSEv49og"},"27":{"id":"27","name":"Praça de Carlos Alberto","lat":41.14821,"lon":-8.61582,"kind":"plac","desc":"Plac stanowi naturalne wejście w zachodnią część centrum i dalej w Cedofeita. Daje dobry początek spokojniejszego dnia z większą uwagą skierowaną na codzienną zabudowę miasta.","number":27,"restaurant":false,"photoTip":"Warto zacząć tu świadome oglądanie bocznych ulic zamiast trzymać się wyłącznie głównych arterii.","placeId":"ChIJyS2gqeJkJA0RAlHKAhUXiRo"},"28":{"id":"28","name":"Cedofeita","lat":41.152,"lon":-8.6185,"kind":"dzielnica","desc":"Cedofeita jest bardziej lokalną, mieszkaniową częścią Porto, z kawiarniami, pracowniami i zabudową, która nie potrzebuje wielkich monumentów, żeby być interesująca. To miejsce na włóczenie się, nie na szybkie zaliczanie punktów.","number":28,"restaurant":false,"photoTip":"Najciekawsze kadry pojawiają się często między głównymi ulicami.","placeId":"ChIJLa9ZOQJlJA0R__eOTHu1i5s"},"29":{"id":"29","name":"Praça do Marquês de Pombal","lat":41.16111,"lon":-8.60448,"kind":"plac","desc":"Duży plac na północnym skraju śródmieścia otwiera spokojniejszą część miasta i pokazuje inne oblicze Porto niż Baixa. Jest dobrym punktem orientacyjnym dla dalszej trasy w stronę Lapa i Bonfim.","number":29,"restaurant":false,"photoTip":"Zwróć uwagę na różnicę skali między placem a bardziej kameralnymi ulicami dzielnicy.","placeId":"ChIJEebE9VdkJA0RWkfEq-v1tus"},"30":{"id":"30","name":"Igreja da Lapa","lat":41.15711,"lon":-8.61212,"kind":"atrakcja","desc":"Monumentalny kościół przy Praça da República należy do ważnych punktów architektonicznych północnej części centrum. Jego położenie dobrze wpisuje się w spacer przez miejskie, mniej turystyczne Porto.","number":30,"restaurant":false,"photoTip":"Warto obejrzeć bryłę z zewnętrznego placu i relację kościoła z zabudową otoczenia.","placeId":"ChIJd6p8Gf9kJA0RfRRBFHLh0Dg"},"31":{"id":"31","na const P=DATA.P, EXTRA=DATA.EXTRA, R=DATA.R, DAYS=DATA.DAYS, INFO=DATA.INFO, KIND_ICON=DATA.KIND_ICON;
const KIND_LABEL={plac:'plac',atrakcja:'atrakcja',widok:'punkt widokowy',most:'most',ocean:'ocean',
 'nabrzeże':'nabrzeże',dzielnica:'dzielnica',park:'park',muzeum:'muzeum',architektura:'architektura',
 transport:'transport',zabytek:'zabytek',restauracja:'restauracja',hotel:'hotel'};

const LS_PROGRESS='porto2026_progress_v2';

/* ---- pomocnicze ---- */
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function kindIcon(k){return KIND_ICON[k]||'📍';}
function kindLabel(k){return KIND_LABEL[k]||k||'';}

function getP(ref){
  if(EXTRA[ref])return EXTRA[ref];
  if(ref==='hotel')return {id:'hotel',name:'The Social Hub Porto',lat:41.1483,lon:-8.60922,kind:'hotel',desc:'Praça de Dom João I 80, 4000-065 Porto.'};
  if(String(ref).startsWith('rest_')){
    const r=R[String(ref).slice(5)];
    return {id:ref,name:r.name,lat:r.lat,lon:r.lon,kind:'restauracja',desc:r.address,number:null,restaurant:true,address:r.address,placeId:r.placeId,hours:r.hours,order:r.order,website:r.website};
  }
  return P[String(ref)];
}

function qOf(p){
  if(p.kind==='restauracja')return p.address;
  if(p.query)return p.query;
  if(p.lat!=null && p.lon!=null)return `${p.lat},${p.lon}`;
  return p.name;
}
function hasCoords(p){return p && p.lat!=null && p.lon!=null;}

function searchLink(p){
  if(p.placeId){
    return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name)}&query_place_id=${encodeURIComponent(p.placeId)}`;
  }
  const q=qOf(p);
  let u=`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(q)}`;
  if(p.kind==='restauracja'&&p.placeId)u+=`&query_place_id=${encodeURIComponent(p.placeId)}`;
  return u;
}
function routeLink(a,b,mode){
  const A=getP(a),B=getP(b);
  const oq=encodeURIComponent(qOf(A)),dq=encodeURIComponent(qOf(B));
  let u=`https://www.google.com/maps/dir/?api=1&origin=${oq}&destination=${dq}&travelmode=${mode||'walking'}`;
  if(A.kind==='restauracja'&&A.placeId)u+=`&origin_place_id=${encodeURIComponent(A.placeId)}`;
  if(B.kind==='restauracja'&&B.placeId)u+=`&destination_place_id=${encodeURIComponent(B.placeId)}`;
  return u;
}
function transportBox(st){
  if(st.type==='metro'||st.type==='metrobus'||st.type==='bus'){
    const label=st.type==='metro'?'🚇 METRO':st.type==='metrobus'?'🚌 METROBUS':'🚌 AUTOBUS';
    return `<div class="transportBox"><div class="transportTitle">${label}</div><div class="transportText">${esc(st.note)}</div></div>`;
  }
  return '';
}
function haversineKm(lat1,lon1,lat2,lon2){
  const R_=6371,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R_*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function formatDistance(km){
  return km<1?`${Math.round(km*1000)} m`:`${km.toFixed(1)} km`;
}
function formatMin(min){
  const h=Math.floor(min/60),m=Math.round(min%60);
  return h>0?`${h}h ${m}min`:`${m} min`;
}
function renderDayStats(day){
  const box=document.getElementById('dayStats');
  const s=day.stats;
  if(!s){box.innerHTML='';return;}
  box.innerHTML=`
    <div class="dayStatsTotal">Hotel → hotel: <b>${formatMin(s.totalMin)}</b> łącznie</div>
    <div class="dayStatsGrid">
      <div class="statChip"><span class="statIcon">🚶</span><span class="statLabel">spacer</span><span class="statVal">${formatMin(s.walkMin)} · ${s.walkKm} km</span></div>
      <div class="statChip"><span class="statIcon">🚇</span><span class="statLabel">dojazdy</span><span class="statVal">${formatMin(s.transitMin)}</span></div>
      <div class="statChip"><span class="statIcon">🍽️</span><span class="statLabel">lunch</span><span class="statVal">${formatMin(s.lunchMin)}</span></div>
      <div class="statChip"><span class="statIcon">⏳</span><span class="statLabel">zapas</span><span class="statVal">${formatMin(s.bufferMin)}</span></div>
    </div>
    <div class="dayStatsNote">Zapas = czas poza samym przejściem między punktami — zwiedzanie wnętrz, spacer po samym miejscu (np. po ogrodzie), kawa, zdjęcia, odpoczynek.</div>`;
}

/* ---- postęp (localStorage) ---- */
function loadAllProgress(){
  try{return JSON.parse(localStorage.getItem(LS_PROGRESS)||'{}');}catch(e){return {};}
}
function saveAllProgress(p){
  try{localStorage.setItem(LS_PROGRESS,JSON.stringify(p));}catch(e){}
}
function getDayProgress(day){
  const all=loadAllProgress();
  let arr=all[day.id];
  if(!Array.isArray(arr)||arr.length!==day.steps.length){arr=day.steps.map(()=>false);}
  return arr;
}
function setDayProgress(day,arr){
  const all=loadAllProgress();
  all[day.id]=arr;
  saveAllProgress(all);
}
function toggleStep(dayId,idx){
  const day=DAYS.find(d=>d.id===dayId);
  const arr=getDayProgress(day);
  arr[idx]=!arr[idx];
  setDayProgress(day,arr);
  renderPlan();
}
function resetDay(dayId){
  const day=DAYS.find(d=>d.id===dayId);
  setDayProgress(day,day.steps.map(()=>false));
  renderPlan();
}
function nextUndoneIndex(day,arr){
  for(let i=0;i<arr.length;i++){if(!arr[i])return i;}
  return -1;
}
function getVisitedPlaceNumbers(){
  const visited=new Set();
  DAYS.forEach(d=>{
    const arr=getDayProgress(d);
    d.steps.forEach((st,idx)=>{
      if(arr[idx]){
        const B=getP(st.b);
        if(B && B.number)visited.add(B.number);
      }
    });
  });
  return visited;
}

let currentView='plan';

/* ---- geolokalizacja: jedno wspólne źródło pozycji dla całej aplikacji ----
   Wymaga bezpiecznego kontekstu (HTTPS) — dlatego strona musi być hostowana
   (np. GitHub Pages), a nie otwierana jako lokalny plik. Zamiast osobnego
   watchPosition() dla każdej mapy i osobnego odpytania dla paska "Dalej",
   jest tu jeden wspólny nasłuch: karty tras, pasek "Dalej" i kropka
   "Ty tu jesteś" na obu mapach subskrybują tę samą pozycję. */
const GEO_DIST_THROTTLE_MS=10000;
let geoWatchId=null;
let lastPos=null;          // {lat, lon, ts}
let lastDistanceRenderTs=0;
let geoDenied=false;       // po odmowie uprawnień nie próbujemy dalej
let geoListeners=[];       // callbacki wywoływane przy KAŻDEJ nowej pozycji (kropki na mapach)

function geoSubscribe(fn){
  geoListeners.push(fn);
  if(lastPos)fn(lastPos);
  return ()=>{geoListeners=geoListeners.filter(f=>f!==fn);};
}
function handleGeoPosition(pos){
  lastPos={lat:pos.coords.latitude,lon:pos.coords.longitude,ts:Date.now()};
  geoListeners.forEach(fn=>{try{fn(lastPos);}catch(e){}});
  const now=Date.now();
  if(now-lastDistanceRenderTs>=GEO_DIST_THROTTLE_MS){
    lastDistanceRenderTs=now;
    refreshLiveDistances();
  }
}
function handleGeoError(err){
  if(err&&err.code===1)geoDenied=true; // 1 = PERMISSION_DENIED
  hideAllDistanceSpans();
}
function geoWantsWatch(){
  return currentView==='plan'||currentView==='index';
}
function refreshGeoWatchState(){
  if(geoWantsWatch()&&!document.hidden){startGeoWatch();}
  else{stopGeoWatch();}
}
function startGeoWatch(){
  if(geoWatchId!=null||!navigator.geolocation||geoDenied)return;
  geoWatchId=navigator.geolocation.watchPosition(
    handleGeoPosition,
    err=>{handleGeoError(err);stopGeoWatch();},
    {enableHighAccuracy:false,maximumAge:30000,timeout:15000}
  );
}
function stopGeoWatch(){
  if(geoWatchId!=null&&navigator.geolocation){try{navigator.geolocation.clearWatch(geoWatchId);}catch(e){}}
  geoWatchId=null;
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){stopGeoWatch();}
  else{refreshGeoWatchState();}
});
function hideAllDistanceSpans(){
  document.querySelectorAll('.distance').forEach(el=>{el.style.display='none';});
  const nb=document.getElementById('nbDist');
  if(nb)nb.textContent=geoDenied?'📍 brak dostępu do lokalizacji':'';
}
/* Jedno miejsce, które wypełnia dystans we wszystkich miejscach, gdzie się
   pojawia — karty kroków w planie dnia, wiersze w "Spis miejsc" i dolny
   pasek "Dalej" — z tej samej, współdzielonej pozycji. Wywoływane po każdym
   throttlowanym odczycie GPS i raz od razu po przebudowaniu widoku
   (żeby nie czekać do 10s). */
function refreshLiveDistances(){
  if(!lastPos)return;
  const d=DAYS[currentDay];
  const arr=getDayProgress(d);
  d.steps.forEach((st,idx)=>{
    if(arr[idx])return; // odwiedzone miejsca nie potrzebują już dystansu na żywo
    const B=getP(st.b);
    if(!hasCoords(B))return;
    const el=document.getElementById(`dist_${idx}`);
    if(!el)return;
    const km=haversineKm(lastPos.lat,lastPos.lon,B.lat,B.lon);
    el.textContent=`📍 ~${formatDistance(km)} do ${esc(B.name)}`;
    el.style.display='';
  });
  // "Spis miejsc" — dystans do KAŻDEJ z 34 atrakcji, niezależnie od tego,
  // na który dzień akurat jest otwarta zakładka "Plan dnia" (kolejność
  // dni i atrakcji może się zmieniać na miejscu ad hoc).
  const visitedNums=getVisitedPlaceNumbers();
  Object.values(P).forEach(p=>{
    if(visitedNums.has(p.number))return;
    if(!hasCoords(p))return;
    const el=document.getElementById(`idxdist_${p.number}`);
    if(!el)return;
    const km=haversineKm(lastPos.lat,lastPos.lon,p.lat,p.lon);
    el.textContent=`📍 ~${formatDistance(km)}`;
    el.style.display='';
  });
  const idx=nextUndoneIndex(d,arr);
  if(idx===-1)return;
  const B=getP(d.steps[idx].b);
  if(!hasCoords(B))return;
  const km=haversineKm(lastPos.lat,lastPos.lon,B.lat,B.lon);
  const nb=document.getElementById('nbDist');
  if(nb)nb.textContent=`~${formatDistance(km)} stąd`;
}

/* ---- wybór dnia wg daty telefonu ---- */
function autoPickDay(){
  const now=new Date();
  let best=0,bestDiff=Infinity;
  DAYS.forEach((d,i)=>{
    const [dd,mm]=d.date.split('.').map(n=>parseInt(n,10));
    const dt=new Date(now.getFullYear(),mm-1,dd);
    let diff=Math.abs(dt-now);
    // preferuj rok 2026 jeśli dopasowanie w innym roku wypadłoby "lepiej" przypadkiem
    const dt2026=new Date(2026,mm-1,dd);
    const diff2026=Math.abs(dt2026-now);
    diff=Math.min(diff,diff2026);
    if(diff<bestDiff){bestDiff=diff;best=i;}
  });
  return best;
}

/* ---- widoki górne (Plan dnia / Spis miejsc / Info) ---- */
function renderViewTabs(){
  const el=document.getElementById('viewTabs');
  el.innerHTML=['plan','index','info'].map(v=>{
    const label=v==='plan'?'Plan dnia':v==='index'?'Spis miejsc':'Info';
    return `<button class="viewTab${currentView===v?' active':''}" data-view="${v}">${label}</button>`;
  }).join('');
  el.querySelectorAll('.viewTab').forEach(b=>b.onclick=()=>{setView(b.dataset.view);});
  document.getElementById('tabs').style.display=currentView==='plan'?'flex':'none';
}
function setView(v){
  const prev=currentView;
  currentView=v;
  try{localStorage.setItem(LS_LASTVIEW,v);}catch(e){}
  renderViewTabs();
  document.getElementById('planView').style.display=v==='plan'?'block':'none';
  document.getElementById('indexView').style.display=v==='index'?'block':'none';
  document.getElementById('infoView').style.display=v==='info'?'block':'none';
  if(prev==='plan'&&v!=='plan')teardownDayMap();
  if(prev==='index'&&v!=='index')teardownOverviewMap();
  if(v==='index'){renderIndex();}
  if(v==='info'&&!document.getElementById('infoView').dataset.built){renderInfo();}
  renderNowBar();
  refreshGeoWatchState();
  window.scrollTo(0,0);
}

/* ---- zakładki dni ---- */
function renderDayTabs(){
  const tabs=document.getElementById('tabs');
  tabs.innerHTML='';
  DAYS.forEach((d,i)=>{
    const b=document.createElement('button');
    b.className='tab'+(i===currentDay?' active':'');
    b.textContent=d.date;
    b.onclick=()=>{currentDay=i;setView('plan');renderPlan();};
    tabs.appendChild(b);
  });
}

/* ---- widok: Plan dnia ---- */
function renderPlan(){
  renderDayTabs();
  const d=DAYS[currentDay];
  const arr=getDayProgress(d);
  const doneCount=arr.filter(Boolean).length;

  document.getElementById('dayHeader').innerHTML=`<div class="dayh">${esc(d.date)} — ${esc(d.title)}</div><div class="summary">${esc(d.summary)}</div>`;
  document.getElementById('dayMeta').innerHTML=`<span class="pill">${esc(d.walk_est)}</span>`;
  renderDayStats(d);
  document.getElementById('routeSummary').innerHTML=`<b>Trasa:</b> ${d.route.map(r=>esc(getP(r).name)).join(' → ')}`;
  document.getElementById('overviewBtn').href=d.routeOverview;
  document.getElementById('progressRow').innerHTML=`<span>${doneCount}/${arr.length} ukończone</span><button id="resetDayBtn" type="button">Wyczyść zaznaczenia</button>`;
  document.getElementById('resetDayBtn').onclick=()=>resetDay(d.id);

  const geoPoints=d.route.map(r=>getP(r)).filter(hasCoords);
  const mapBtn=document.getElementById('mapToggleBtn');
  const mapWrap=document.getElementById('mapWrap');
  if(geoPoints.length>=2){
    mapBtn.style.display='inline-block';
    mapBtn.onclick=()=>toggleMap(d);
    if(mapWrap.classList.contains('open')&&dayMapFor!==d.id){
      document.getElementById('mapMeta').textContent='Wczytywanie mapy… (wymaga internetu)';
      ensureLeaflet(()=>initDayMap(d));
    }
  }else{
    mapBtn.style.display='none';
    if(mapWrap.classList.contains('open')){
      mapWrap.classList.remove('open');
      mapBtn.textContent='Pokaż mapę dnia';
    }
    teardownDayMap();
  }

  let out='';
  d.steps.forEach((st,idx)=>{
    const B=getP(st.b);
    const done=!!arr[idx];
    let dest='';
    if(B.kind==='hotel')dest='<span class="hotelTag">HOTEL</span>';
    if(B.kind==='restauracja')dest='<span class="restTag">LUNCH</span>';
    let lunch='';
    if(st.lunch){
      const l=R[st.lunch];
      const websiteLink=l.website?` · <a href="${esc(l.website)}" target="_blank" rel="noopener">strona restauracji</a>`:'';
      lunch=`<div class="restaurantNote"><b>${esc(l.name)}</b> · <b>Warto zamówić:</b> ${esc(l.order)}<span class="addr">📍 ${esc(l.address)} · 🕐 ${esc(l.hours)}${websiteLink}</span></div>`;
    }

    // rozwijany pełny opis celu (tylko dla ponumerowanych miejsc z opisem)
    let moreBlock='';
    if(B && B.number && B.desc){
      const mid=`more_${d.id}_${idx}`;
      moreBlock=`<div class="more"><div class="moreToggle" data-more="${mid}">ℹ️ Więcej o: ${esc(B.name)} <span data-arrow="${mid}">▾</span></div>
        <div class="moreBody" id="${mid}">${esc(B.desc)}${B.photoTip?`<div class="photoTip"><span class="cam">📷</span><span>${esc(B.photoTip)}</span></div>`:''}</div></div>`;
    }

    // dystans na żywo — tylko dla niezaliczonych kroków z realnymi współrzędnymi celu
    const distSpan=(!done&&hasCoords(B))?`<span class="distance" id="dist_${idx}" style="display:none"></span>`:'';

    // "Plan B — skróć tutaj": opcjonalna wskazówka na wypadek zmęczenia/pogody
    const shortcutBlock=st.shortcut?`<div class="planB"><b>🔀 Plan B:</b> ${esc(st.shortcut)}</div>`:'';

    out+=`<div class="step${done?' done':''}">
      <div class="stepCheck" data-toggle="${idx}">${done?'✓':''}</div>
      <div class="stepBody">
        <div class="time">${esc(st.time)}${st.realMin!=null?` <span class="realTime">(~${st.realMin} min)</span>`:''}</div>
        <div class="stepTitle">${kindIcon(B.kind)} ${esc(st.title)} ${dest}</div>
        <div class="stepNote">${esc(st.note)}</div>
        ${distSpan}
        ${lunch}
        ${transportBox(st)}
        ${moreBlock}
        ${shortcutBlock}
        <div class="btnrow">
          <a class="btn alt" target="_blank" rel="noopener" href="${searchLink(B)}">Otwórz lokalizację</a>
        </div>
      </div>
    </div>`;
  });
  out+=`<div class="finish"><b>Koniec dnia:</b> The Social Hub Porto. Każda trasa w tym planie zaczyna się i kończy w hotelu.</div>`;
  document.getElementById('steps').innerHTML=out;

  document.querySelectorAll('.stepCheck').forEach(el=>{
    el.onclick=()=>toggleStep(d.id,parseInt(el.dataset.toggle,10));
  });
  document.querySelectorAll('.moreToggle').forEach(el=>{
    el.onclick=()=>{
      const id=el.dataset.more;
      const body=document.getElementById(id);
      const arrow=el.querySelector(`[data-arrow="${id}"]`);
      body.classList.toggle('open');
      arrow.textContent=body.classList.contains('open')?'▴':'▾';
    };
  });

  renderNowBar();
  refreshLiveDistances();
  refreshDayMapMarkers(d);
}

/* ---- pasek "Dalej" — jedno miejsce z bieżącym krokiem, dystansem i zapowiedzią kolejnego ---- */
function renderNowBar(){
  const bar=document.getElementById('nowBar');
  if(currentView!=='plan'){bar.style.display='none';return;}
  const d=DAYS[currentDay];
  const arr=getDayProgress(d);
  const idx=nextUndoneIndex(d,arr);
  if(idx===-1){
    bar.style.display='flex';
    bar.innerHTML=`<div class="nbInfo"><div class="nbLabel">Dzień ${esc(d.date)}</div><div class="nbTitle">🎉 Wszystkie kroki ukończone</div></div>`;
    return;
  }
  const st=d.steps[idx];
  const B=getP(st.b);
  const url=st.url||routeLink(st.a,st.b,st.type==='walk'?'walking':'transit');
  let nextTxt='koniec dnia w hotelu';
  if(idx+1<d.steps.length){
    const nst=d.steps[idx+1];
    if(nst.type==='restaurant'){
      nextTxt=`lunch — ${esc(R[nst.lunch].name)}`;
    }else{
      const nb=getP(nst.b);
      nextTxt=`${kindIcon(nb.kind)} ${esc(nb.name)}`;
    }
  }
  bar.style.display='flex';
  bar.innerHTML=`<div class="nbInfo"><div class="nbLabel">Dalej · ${esc(st.time)}</div><div class="nbTitle">${kindIcon(B.kind)} ${esc(st.title)}</div><div class="nbDist" id="nbDist"></div><div class="nbNext">Następnie: ${nextTxt}</div></div>
    <a class="btn primary" target="_blank" rel="noopener" href="${url}">Nawiguj →</a>`;
  if(geoDenied)document.getElementById('nbDist').textContent='📍 brak dostępu do lokalizacji';
}

/* ---- widok: Spis miejsc ---- */
function renderIndex(){
  teardownOverviewMap();
  document.getElementById('indexView').dataset.built='1';
  const visited=getVisitedPlaceNumbers();
  const nums=Object.keys(P).sort((a,b)=>P[a].number-P[b].number);
  const buildRow=(obj,isRest)=>{
    const id=isRest?`idx_r_${obj.key}`:`idx_p_${obj.number}`;
    const name=obj.name,kind=isRest?'restauracja':obj.kind;
    const sub=isRest?esc(obj.address):kindLabel(kind);
    const isVisited=!isRest&&visited.has(obj.number);
    const numTxt=isRest?'🍽️':(isVisited?`${obj.number}<span class="idxDoneMark">✓</span>`:obj.number);
    const desc=isRest?`<b>Godziny lunchu:</b> ${esc(obj.hours)}<br><b>Warto zamówić:</b> ${esc(obj.order)}${obj.website?`<br><a href="${esc(obj.website)}" target="_blank" rel="noopener">strona restauracji</a>`:''}`:
      `${esc(obj.desc)}${obj.photoTip?`<div class="photoTip"><span class="cam">📷</span><span>${esc(obj.photoTip)}</span></div>`:''}`;
    return `<div class="idxItem${isVisited?' visited':''}" data-search="${esc((name+' '+sub).toLowerCase())}">
      <div class="idxHead" data-idx="${id}">
        <span class="idxNum">${numTxt}</span>
        <span class="idxName">${kindIcon(kind)} ${esc(name)}</span>
        <span class="idxKind">${sub}</span>
      </div>
      ${(!isRest&&!isVisited)?`<span class="distance idxDist" id="idxdist_${obj.number}" style="display:none"></span>`:''}
      <div class="idxBody" id="${id}">${desc}
        <div class="btnrow"><a class="btn alt" target="_blank" rel="noopener" href="${searchLink(obj.link)}">Otwórz lokalizację</a></div>
      </div>
    </div>`;
  };
  let html=`<div class="card">
    <input class="searchBox" id="idxSearch" placeholder="Szukaj miejsca po nazwie…">
    <div class="btnrow"><button id="overviewMapBtn" class="btn alt mapBtn" type="button">Pokaż mapę wszystkich atrakcji</button></div>
    <div class="mapWrap" id="overviewMapWrap"><div class="mapEl" id="overviewMapEl"></div><div class="mapMeta" id="overviewMapMeta"></div></div>
  </div>`;
  html+=`<div class="card"><div class="sectionH" style="margin-top:0">Miejsca 1–34${visited.size?` · ${visited.size} odwiedzonych`:''}</div>`;
  nums.forEach(k=>{
    const o=P[k];
    html+=buildRow({...o,link:o},false);
  });
  html+='</div>';
  html+=`<div class="card"><div class="sectionH" style="margin-top:0">Restauracje na lunch</div>`;
  Object.keys(R).forEach(k=>{
    const r=R[k];
    html+=buildRow({...r,key:k,link:{...r,kind:'restauracja'}},true);
  });
  html+='</div>';
  document.getElementById('indexView').innerHTML=html;

  document.querySelectorAll('.idxHead').forEach(el=>{
    el.onclick=()=>{document.getElementById(el.dataset.idx).classList.toggle('open');};
  });
  document.getElementById('idxSearch').oninput=(e)=>{
    const q=e.target.value.trim().toLowerCase();
    document.querySelectorAll('.idxItem').forEach(it=>{
      it.style.display=it.dataset.search.includes(q)?'':'none';
    });
  };
  document.getElementById('overviewMapBtn').onclick=toggleOverviewMap;
  refreshLiveDistances();
}

/* ---- widok: Info ---- */
function renderInfo(){
  document.getElementById('infoView').dataset.built='1';
  const li=arr=>arr.map(x=>`<li>${esc(x)}</li>`).join('');
  let html=`<div class="card">
    <div class="sectionH" style="margin-top:0">Zasady planu</div>
    <ul class="infoList">${li(INFO.zasady)}</ul>
    <div class="sectionH">Jedzenie i kolacje</div>
    <ul class="infoList">${li(INFO.jedzenie)}</ul>
    <div class="sectionH">Elastyczność, pogoda, topografia</div>
    <ul class="infoList">${li(INFO.elastycznosc)}</ul>
    <div class="sectionH">Weryfikacja</div>
    <p class="infoP">${esc(INFO.weryfikacja)}</p>
    <div class="sectionH">Przydatne linki</div>
    ${INFO.linki.map(l=>`<div class="linkRow"><a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)}</a></div>`).join('')}
  </div>`;

}

/* ---- mapa (Leaflet, ładowana na żądanie) ---- */
function ensureLeaflet(cb){
  if(window.L){cb();return;}
  if(leafletReady){setTimeout(()=>ensureLeaflet(cb),150);return;}
  leafletReady=true;
  const link=document.createElement('link');
  link.rel='stylesheet';
  link.href='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css';
  document.head.appendChild(link);
  const script=document.createElement('script');
  script.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js';
  script.onload=cb;
  script.onerror=()=>{document.getElementById('mapMeta').textContent='Nie udało się wczytać mapy — brak internetu? Reszta planu działa offline.';};
  document.head.appendChild(script);
}
function toggleMap(day){
  const wrap=document.getElementById('mapWrap');
  wrap.classList.toggle('open');
  document.getElementById('mapToggleBtn').textContent=wrap.classList.contains('open')?'Ukryj mapę dnia':'Pokaż mapę dnia';
  if(wrap.classList.contains('open')){
    document.getElementById('mapMeta').textContent='Wczytywanie mapy… (wymaga internetu)';
    ensureLeaflet(()=>initDayMap(day));
  }else{
    teardownDayMap();
  }
  refreshGeoWatchState();
}
const DAY_MAP_COLOR='#1e3a8a';
function dayVisitedRefs(day){
  const arr=getDayProgress(day);
  const refs=new Set();
  day.steps.forEach((st,idx)=>{if(arr[idx])refs.add(String(st.b));});
  return refs;
}
function dayMapGlyph(p){
  if(p.number)return String(p.number); // ten sam numer co w "Spis miejsc"
  if(p.kind==='hotel')return 'H';
  return kindIcon(p.kind); // 🍽️ restauracja, 🚇 przystanek — pozostałe typy w tych danych nie występują poza trasą dnia
}
function teardownDayMap(){
  if(dayMapUnsub){try{dayMapUnsub();}catch(e){}}
  if(dayMap){try{dayMap.remove();}catch(e){}}
  dayMap=null;dayMapUnsub=null;dayMapFor=null;dayMapMarkers=null;
}
function initDayMap(day){
  if(!window.L)return;
  teardownDayMap();
  const el=document.getElementById('mapEl');
  if(!el)return;
  const map=L.map(el);
  dayMap=map;dayMapFor=day.id;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,attribution:'© OpenStreetMap contributors'
  }).addTo(map);
  const routeRefs=day.route.filter(r=>hasCoords(getP(r)));
  const pts=routeRefs.map(r=>getP(r));
  const latlngs=pts.map(p=>[p.lat,p.lon]);
  dayMapMarkers=[];
  if(latlngs.length){
    L.polyline(latlngs,{color:DAY_MAP_COLOR,weight:3,opacity:.8}).addTo(map);
    const visitedRefs=dayVisitedRefs(day);
    pts.forEach((p,i)=>{
      const isVisited=visitedRefs.has(String(routeRefs[i]));
      const glyph=dayMapGlyph(p);
      const marker=L.marker([p.lat,p.lon],{icon:dayMapIcon(glyph,isVisited)}).addTo(map).bindPopup(`${esc(p.name)}${isVisited?'<br>✓ odwiedzone':''}`);
      dayMapMarkers.push({ref:String(routeRefs[i]),glyph,marker});
    });
    map.fitBounds(latlngs,{padding:[24,24]});
  }
  document.getElementById('mapMeta').textContent='Numery pinezek odpowiadają numeracji ze „Spisu miejsc" (H = hotel, 🍽️ = restauracja, 🚇 = przystanek); szary = już odwiedzone. Kafelki mapy wymagają internetu — reszta planu działa offline.';

  let userMarker=null;
  dayMapUnsub=geoSubscribe(pos=>{
    const ll=[pos.lat,pos.lon];
    if(!userMarker){
      const meIcon=L.divIcon({className:'',html:'<div style="background:#dc2626;width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)"></div>',iconSize:[10,10],iconAnchor:[5,5]});
      userMarker=L.marker(ll,{icon:meIcon}).addTo(map).bindPopup('📍 Twoja przybliżona pozycja');
    }else{
      userMarker.setLatLng(ll);
    }
  });
  setTimeout(()=>{try{map.invalidateSize();}catch(e){}},150);
}
function dayMapIcon(glyph,isVisited){
  const bg=isVisited?'var(--muted)':DAY_MAP_COLOR;
  return L.divIcon({className:'',html:`<div style="background:${bg};color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)${isVisited?';opacity:.75':''}">${glyph}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
}
/* Odświeża same kolory pinezek na już otwartej mapie dnia — wywoływane po
   każdym zaznaczeniu/odznaczeniu checkboxa, żeby nie trzeba było chować
   i pokazywać mapy na nowo. Nie dotyka samej mapy/kafelków/GPS. */
function refreshDayMapMarkers(day){
  if(!dayMap||!dayMapMarkers||dayMapFor!==day.id)return;
  const visitedRefs=dayVisitedRefs(day);
  dayMapMarkers.forEach(m=>{
    m.marker.setIcon(dayMapIcon(m.glyph,visitedRefs.has(m.ref)));
  });
}

/* ---- mapa ogólna: wszystkie 34 atrakcje ---- */
function toggleOverviewMap(){
  const wrap=document.getElementById('overviewMapWrap');
  const btn=document.getElementById('overviewMapBtn');
  wrap.classList.toggle('open');
  btn.textContent=wrap.classList.contains('open')?'Ukryj mapę wszystkich atrakcji':'Pokaż mapę wszystkich atrakcji';
  if(wrap.classList.contains('open')){
    document.getElementById('overviewMapMeta').textContent='Wczytywanie mapy… (wymaga internetu)';
    ensureLeaflet(initOverviewMap);
  }else{
    teardownOverviewMap();
  }
  refreshGeoWatchState();
}
function teardownOverviewMap(){
  if(overviewMapUnsub){try{overviewMapUnsub();}catch(e){}}
  if(overviewMap){try{overviewMap.remove();}catch(e){}}
  overviewMap=null;overviewMapUnsub=null;
}
function initOverviewMap(){
  if(!window.L)return;
  teardownOverviewMap();
  const el=document.getElementById('overviewMapEl');
  if(!el)return;
  const map=L.map(el);
  overviewMap=map;
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    maxZoom:19,attribution:'© OpenStreetMap contributors'
  }).addTo(map);
  const visited=getVisitedPlaceNumbers();
  const pts=Object.keys(P).map(k=>P[k]).filter(hasCoords).sort((a,b)=>a.number-b.number);
  const latlngs=[];
  pts.forEach(p=>{
    latlngs.push([p.lat,p.lon]);
    const isVisited=visited.has(p.number);
    const bg=isVisited?'var(--muted)':'#2563eb';
    const icon=L.divIcon({className:'',html:`<div style="background:${bg};color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)${isVisited?';opacity:.75':''}">${p.number}</div>`,iconSize:[24,24],iconAnchor:[12,12]});
    L.marker([p.lat,p.lon],{icon}).addTo(map).bindPopup(`<b>${esc(p.number+'. '+p.name)}</b>${isVisited?'<br>✓ odwiedzone':''}<br><a href="${searchLink(p)}" target="_blank" rel="noopener">Otwórz w Google Maps</a>`);
  });
  if(latlngs.length)map.fitBounds(latlngs,{padding:[20,20]});
  document.getElementById('overviewMapMeta').textContent='Szare numerki = miejsca już odwiedzone. Kafelki mapy wymagają internetu — reszta aplikacji działa offline.';

  let userMarker=null;
  overviewMapUnsub=geoSubscribe(pos=>{
    const ll=[pos.lat,pos.lon];
    if(!userMarker){
      const meIcon=L.divIcon({className:'',html:'<div style="background:#dc2626;width:10px;height:10px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.5)"></div>',iconSize:[10,10],iconAnchor:[5,5]});
      userMarker=L.marker(ll,{icon:meIcon}).addTo(map).bindPopup('📍 Twoja przybliżona pozycja');
    }else{
      userMarker.setLatLng(ll);
    }
  });
  setTimeout(()=>{try{map.invalidateSize();}catch(e){}},150);
}

/* ---- start ---- */
/* ---- start ---- */
function init(){
  currentDay=autoPickDay();
  renderViewTabs();
  renderPlan();
  refreshGeoWatchState();
}
init();
